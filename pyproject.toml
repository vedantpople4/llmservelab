[project]
name = "llmservelab"
version = "0.0.1"
description = "Reproducible experimentation platform for LLM-serving performance and request scheduling."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "matplotlib>=3.8",
    "scipy>=1.13",
    "pydantic>=2.7",
    "tokenizers>=0.19",
]

[project.optional-dependencies]
# `vllm` is Linux-only (no wheels elsewhere); the pin must match docker/compose.yml's VLLM_IMAGE.
# It must be *declared*, not `uv pip install`-ed out-of-band: `uv sync --locked` (the Kaggle
# runbook's install step of record) only provisions declared dependencies, so an undeclared
# vllm is simply absent and `uv run vllm` fails with "Failed to spawn: vllm".
gpu = ["nvidia-ml-py>=12", "vllm==0.10.2; sys_platform == 'linux'"]
mock = ["fastapi>=0.111", "uvicorn>=0.30"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "hypothesis>=6.100", "types-PyYAML"]

[project.scripts]
llmserve = "llmserve.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llmserve"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["pyarrow.*", "scipy.*", "matplotlib.*", "pynvml.*"]
ignore_missing_imports = true
