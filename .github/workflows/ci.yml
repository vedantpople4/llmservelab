name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy llmserve tests
      - run: uv run pytest -q
      - name: Validate committed experiment configs
        run: uv run llmserve validate $(find configs -name '*.yaml' -not -path 'configs/workloads/*')
