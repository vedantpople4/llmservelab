# The Azure conv trace's steady window on the in-package mock server, replayed at 10x speed with
# the gateway on. Start the backend first:  uv run python -m llmserve.mock --port 8001
schema_version: 1
experiment: trace-steady-mock
description: Azure conv 2023 steady window on the mock backend.
seed: 42
repetitions: 1

server:
  kind: mock
  endpoint: http://localhost:8001/v1
  model: mock

load:
  mode: open
  arrival: {process: replay, trace: configs/traces/azure-conv-2023-steady.csv, time_scale: 10}
  requests: 150

gateway:
  enabled: true
  max_in_flight: 32
  scheduler: {name: waas, params: {cost_weight: 2.0, max_bypass: 32}}
  output_estimator: class_prior
  output_prior: configs/output_priors/azure-conv.json

workload:
  trace: configs/traces/azure-conv-2023-steady.csv
  classes:
    - name: long_context
      priority: medium
      match: {prompt_min: 2048}
      prompt: {distribution: fixed, tokens: 2048}
      output: {distribution: fixed, tokens: 128}
    - name: generation_heavy
      priority: low
      match: {output_min: 256}
      prompt: {distribution: fixed, tokens: 128}
      output: {distribution: fixed, tokens: 512}
    - name: interactive
      priority: high
      prompt: {distribution: fixed, tokens: 512}
      output: {distribution: fixed, tokens: 128}

measurement:
  warmup: {requests: 0}
  request_timeout_s: 600
