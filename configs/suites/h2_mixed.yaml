# H2 (plan Phase 3 item 4), mixed side: short-request tail latency in the mixed workload at
# rho 0.85.
suite: h2-mixed
description: >-
  H2: the mixed workload at rho = 0.85 (Poisson, 600 s, warm-up 60 s, cool-down 30 s trimmed);
  compare its interactive requests' P95/P99 TTFT with h2-interactive at the same rho. Needs the
  capacity measured by capacity-mixed at run time: --set load.capacity_rps=<req/s>.
base: ../baseline/e07.yaml
set:
  repetitions: 3
  load: {mode: open, arrival: {process: poisson, rho: 0.85}, duration_s: 600}
  measurement.warmup_s: 60
  measurement.cooldown_s: 30
points:
  - label: rho085
