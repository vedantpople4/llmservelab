# H3 (plan Phase 3 item 2): TTFT vs prompt length at concurrency 1, for TTFT = a + b*p + c*p^2.
suite: prompt-length
description: >-
  H3: prompt length 128 to 8192 tokens at concurrency 1 with a fixed 16-token output, so each
  request is dominated by its prefill. 30 requests per point and 3 repetitions: single-stream
  TTFT has low variance, and 8192 tokens take ~13 s to prefill on the Mac.
base: ../baseline/e01.yaml
set:
  repetitions: 3
  load.concurrency: 1
  load.requests: 30
  workload:
    classes:
      - name: prompt_sweep
        prompt: {distribution: fixed, tokens: 128}
        output: {distribution: fixed, tokens: 16}
sweep:
  field: workload.classes.0.prompt.tokens
  values: [128, 256, 512, 1024, 2048, 4096, 8192]
  label: "p{value:04d}"
