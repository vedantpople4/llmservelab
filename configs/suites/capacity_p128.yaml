# Capacity search for 128/128 (plan Phase 3 item 2): the open-loop rate where queue wait grows
# without bound. This defines rho = 1 for the workload.
suite: capacity-p128
description: >-
  Capacity search for E01's 128/128 workload: Poisson arrivals at 0.2 to 1.2 req/s for 300 s
  (warm-up 30 s, cool-down 15 s trimmed). Closed loop on the Mac reached 0.80 req/s at C=64, so
  the rates span well below to 1.5x that, and 300 s keeps 60+ arrivals at the lowest rate. One repetition: this locates the knee,
  it is not a measurement.
base: ../baseline/e01.yaml
set:
  repetitions: 1
  load: {mode: open, arrival: {process: poisson}, duration_s: 300}
  measurement.warmup_s: 30
  measurement.cooldown_s: 15
sweep:
  field: load.arrival.rate
  values: [0.2, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.2]
  label: "r{value:.2f}"
