# H1 for the heterogeneous workload (plan Phase 3 item 2).
suite: concurrency-mixed
description: >-
  H1: E07's mixed workload (configs/workloads/mixed.yaml) at concurrency 1 to 32. Requests scale
  as max(60, 10*C). 3 repetitions: a mixed request averages ~1,350 prompt and ~220 output tokens,
  about 4 s of the Mac at batch 16, so each point costs several times its 128/128 counterpart.
  C=64 is left out: the Mac's mixed throughput has flattened by C=32 (0.22 req/s at C=16), and
  the long-context class would exceed the 53k-token KV pool there.
base: ../baseline/e07.yaml
set:
  repetitions: 3
  load.requests: 60
sweep:
  field: load.concurrency
  values: [1, 2, 4, 8, 16, 32]
  label: "c{value:03d}"
  set_per_value:
    8: {load.requests: 80}
    16: {load.requests: 160}
    32: {load.requests: 320}
