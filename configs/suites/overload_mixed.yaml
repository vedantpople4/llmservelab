# Generated by scripts/matrix_suites.py --max-in-flight 16.
suite: overload-mixed
description: 'Phase 7 overload: E07''s mixed workload at rho 1.05, 1.2, gateway FIFO and WAAS (cost_weight
  2, max_bypass 32, class-prior estimates) at max_in_flight 32, and no gateway, 2 held-out seeds from
  1000, each (seed, rho) pair''s setups back to back in alternating order, against a FCFS vLLM started
  with --long-prefill-token-threshold 256. Generated by scripts/matrix_suites.py; edit that, not this
  file.'
base: ../baseline/e07.yaml
set:
  repetitions: 1
  gateway:
    enabled: true
    max_in_flight: 16
    output_estimator: class_prior
    output_prior: configs/output_priors/mixed.json
  load:
    mode: open
    arrival:
      process: poisson
    duration_s: 1200
    capacity_rps: 0.15
  workload:
    classes:
    - name: interactive
      weight: 0.6
      priority: high
      slo:
        ttft_ms: 1500
        tpot_ms: 200
      prompt:
        distribution: uniform
        min: 128
        max: 512
      output:
        distribution: fixed
        tokens: 128
    - name: long_context
      weight: 0.25
      priority: medium
      slo:
        ttft_ms: 9000
        tpot_ms: 200
      prompt:
        distribution: choice
        values:
        - 2048
        - 4096
        - 8192
        weights:
        - 0.5
        - 0.3
        - 0.2
      output:
        distribution: fixed
        tokens: 128
    - name: generation_heavy
      weight: 0.15
      priority: low
      slo:
        ttft_ms: 6000
        tpot_ms: 300
      prompt:
        distribution: fixed
        tokens: 256
      output:
        distribution: choice
        values:
        - 512
        - 1024
  measurement.warmup_s: 120
  measurement.cooldown_s: 60
  measurement.request_timeout_s: 1800
  server.long_prefill_token_threshold: 256
points:
