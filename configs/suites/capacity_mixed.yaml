# Capacity search for the mixed workload (plan Phase 3 item 2); defines rho = 1 for h2-mixed.
suite: capacity-mixed
description: >-
  Capacity search for E07's mixed workload: Poisson arrivals at 0.05 to 0.4 req/s for 600 s
  (warm-up 60 s, cool-down 30 s trimmed). Prefill of the long-context class dominates; closed
  loop on the Mac reached 0.22 req/s at C=16, and 600 s keeps 30 arrivals at the lowest rate. One repetition: this locates the knee, it is not a
  measurement.
base: ../baseline/e07.yaml
set:
  repetitions: 1
  load: {mode: open, arrival: {process: poisson}, duration_s: 600}
  measurement.warmup_s: 60
  measurement.cooldown_s: 30
sweep:
  field: load.arrival.rate
  values: [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.4]
  label: "r{value:.2f}"
