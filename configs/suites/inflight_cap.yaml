# In-flight cap (plan Phase 5 item 4): the gateway's max_in_flight for the scheduler comparison.
# Pick the smallest cap that keeps >= 95% of uncapped throughput; the curve is itself a figure.
suite: inflight-cap
description: >-
  FIFO behind the gateway on E07's mixed workload at rho = 0.9 of its 0.2 req/s capacity
  (Poisson at 0.18 req/s, 1200 s, warm-up 120 s, cool-down 60 s trimmed), sweeping max_in_flight
  over 4, 8, 16, 32, 64 and 256. 256 is vLLM's --max-num-seqs, so it stands for uncapped while
  keeping the gateway in the path. Low caps back requests up in the gateway, so request_timeout_s
  is raised to 1800 to measure the backlog rather than fail on it. One repetition per cap.
base: ../baseline/e07.yaml
set:
  repetitions: 1
  gateway: {enabled: true, scheduler: {name: fifo}}
  load: {mode: open, arrival: {process: poisson, rate: 0.18}, duration_s: 1200}
  measurement.warmup_s: 120
  measurement.cooldown_s: 60
  measurement.request_timeout_s: 1800
sweep:
  field: gateway.max_in_flight
  values: [4, 8, 16, 32, 64, 256]
  label: "c{value:03d}"
