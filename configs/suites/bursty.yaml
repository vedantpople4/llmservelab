# Bursty load with FIFO admission (plan Phase 3 item 2): queue depth, TTFT and KV usage over time.
suite: bursty
description: >-
  A burst over normal load for the mixed workload through the gateway with FIFO admission: 0.1
  req/s for 120 s, 1.0 req/s for 60 s, 0.1 req/s for 120 s. The quiet phases sit near half the
  Mac's mixed capacity (~0.2 req/s) and the burst at ~5x it, the PRD's 5 -> 50 -> 5 shape scaled
  to the Mac. The ~60-request backlog takes several minutes to drain, so request_timeout_s is
  raised to 1800. Later phases add scheduler points here.
base: ../baseline/e07.yaml
set:
  repetitions: 3
  gateway: {enabled: true, scheduler: {name: fifo}}
  load:
    mode: open
    arrival:
      process: bursty
      phases:
        - {duration_s: 120, rate: 0.1}
        - {duration_s: 60, rate: 1.0}
        - {duration_s: 120, rate: 0.1}
    duration_s: 300
  measurement.request_timeout_s: 1800
points:
  - label: fifo
