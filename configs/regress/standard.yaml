# Standard regression workload (plan Phase 7 item 6, PRD §39): about 5 minutes on the M5 Air.
# `llmserve regress` runs it and compares with standard.baseline.json. Serve with:
#   ~/.venv-vllm-metal/bin/vllm serve Qwen/Qwen2.5-7B-Instruct-AWQ \
#     --revision b25037543e9394b818fdfca67ab2a00ecc7dd641 --host 127.0.0.1 --port 8000 \
#     --max-model-len 10240 --dtype float16 --no-enable-prefix-caching --max-num-seqs 256 \
#     --gpu-memory-utilization 0.5
schema_version: 1
experiment: regress-standard
seed: 42
repetitions: 1

server:
  kind: vllm-metal
  endpoint: http://localhost:8000/v1
  model: Qwen/Qwen2.5-7B-Instruct-AWQ
  model_revision: b25037543e9394b818fdfca67ab2a00ecc7dd641
  expected_version: "0.31.0"
  prefix_caching: false

load:
  mode: closed
  concurrency: 4
  requests: 160

workload:
  classes:
    - name: p128_o128
      prompt: {distribution: fixed, tokens: 128}
      output: {distribution: fixed, tokens: 128}

measurement:
  warmup: {requests: 8, settle_timeout_s: 30}
