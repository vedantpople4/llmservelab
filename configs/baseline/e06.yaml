# E06: 1024-token prompts, 512-token outputs, concurrency 8 (PRD §11).
schema_version: 1
experiment: e06
seed: 42
repetitions: 5

server:
  kind: vllm-metal
  endpoint: http://localhost:8000/v1
  model: Qwen/Qwen2.5-7B-Instruct-AWQ  # INT4 weights, served by vllm-metal on an M5 (ADR-0013)
  model_revision: b25037543e9394b818fdfca67ab2a00ecc7dd641  # HF commit of Qwen2.5-7B-Instruct-AWQ (2024-10-09)
  expected_version: "0.31.0"
  prefix_caching: false

load:
  mode: closed
  concurrency: 8
  requests: 150

workload:
  classes:
    - name: p1024_o512
      prompt: {distribution: fixed, tokens: 1024}
      output: {distribution: fixed, tokens: 512}

measurement:
  warmup: {requests: 20}
