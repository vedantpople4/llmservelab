# E06: 1024-token prompts, 512-token outputs, concurrency 8 (PRD §11).
schema_version: 1
experiment: e06
seed: 42
repetitions: 5

server:
  kind: vllm
  endpoint: http://localhost:8000/v1
  model: Qwen/Qwen2.5-7B-Instruct-AWQ  # §6 re-pin (ADR-0011): INT4 on one T4
  model_revision: null        # pin the commit SHA before Phase 3 runs
  prefix_caching: false

load:
  mode: closed
  concurrency: 8
  requests: 1000

workload:
  classes:
    - name: p1024_o512
      prompt: {distribution: fixed, tokens: 1024}
      output: {distribution: fixed, tokens: 512}

measurement:
  warmup: {requests: 20}
