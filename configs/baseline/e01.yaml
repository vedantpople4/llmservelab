# E01: 128-token prompts, 128-token outputs, concurrency 1 (PRD §11).
schema_version: 1
experiment: e01
seed: 42
repetitions: 5

server:
  kind: vllm
  endpoint: http://localhost:8000/v1
  model: Qwen/Qwen2.5-7B-Instruct-AWQ  # §6 re-pin (ADR-0011): INT4 on one T4
  model_revision: null        # pin the commit SHA before Phase 3 runs
  prefix_caching: false

load:
  mode: closed
  concurrency: 1
  requests: 200  # single stream has low variance; 200 is enough

workload:
  classes:
    - name: p128_o128
      prompt: {distribution: fixed, tokens: 128}
      output: {distribution: fixed, tokens: 128}

measurement:
  warmup: {requests: 20}
